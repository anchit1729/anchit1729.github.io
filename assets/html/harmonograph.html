<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Harmonograph</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Share+Tech+Mono&display=swap"
            rel="stylesheet" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #f7f4f0;
                --border: rgba(100, 60, 160, 0.18);
                --purple: #6a0dad;
                --purple-dim: rgba(106, 13, 173, 0.38);
                --text: #3a1a5c;
                --text-dim: rgba(106, 13, 173, 0.42);
                --ui-bg: rgba(247, 244, 240, 0.9);
            }

            html,
            body {
                width: 100%;
                height: 100%;
                background: var(--bg);
                overflow: hidden;
            }

            #canvas-wrap {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }

            canvas#gl {
                display: block;
                box-shadow: 0 4px 48px rgba(106, 13, 173, 0.09);
            }

            /* ── Mode pill bar ── */
            #mode-bar {
                position: fixed;
                top: 26px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 20;
                display: flex;
                gap: 2px;
                background: var(--ui-bg);
                border: 1px solid var(--border);
                border-radius: 40px;
                padding: 4px;
                backdrop-filter: blur(14px);
                box-shadow: 0 2px 18px rgba(106, 13, 173, 0.07);
            }

            .mode-pill {
                font-family: "Share Tech Mono", monospace;
                font-size: 9px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                padding: 7px 17px;
                border-radius: 32px;
                border: none;
                background: transparent;
                color: var(--text-dim);
                cursor: pointer;
                transition: all 0.2s;
                white-space: nowrap;
            }
            .mode-pill:hover {
                color: var(--purple);
            }
            .mode-pill.active {
                background: var(--purple);
                color: #fff;
                box-shadow: 0 2px 14px rgba(106, 13, 173, 0.32);
            }

            /* ── Mode description ── */
            #mode-desc {
                position: fixed;
                bottom: 44px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 20;
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-weight: 300;
                font-size: 12.5px;
                color: var(--text-dim);
                letter-spacing: 0.04em;
                pointer-events: none;
                white-space: nowrap;
            }

            /* ── Bottom info strip ── */
            #info-bar {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 20;
                display: flex;
                align-items: center;
                gap: 20px;
                font-family: "Share Tech Mono", monospace;
                font-size: 9px;
                letter-spacing: 0.2em;
                color: var(--text-dim);
                pointer-events: none;
                white-space: nowrap;
            }
            #info-bar .sep {
                opacity: 0.28;
            }
            #info-bar span {
                color: var(--purple);
            }

            /* ── Title watermark ── */
            #title-mark {
                position: fixed;
                top: 24px;
                left: 30px;
                z-index: 20;
                pointer-events: none;
            }
            #title-mark .t1 {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-weight: 300;
                font-size: 18px;
                color: var(--text);
                letter-spacing: 0.03em;
                line-height: 1;
            }
            #title-mark .t2 {
                font-family: "Share Tech Mono", monospace;
                font-size: 7px;
                letter-spacing: 0.28em;
                color: var(--text-dim);
                text-transform: uppercase;
                margin-top: 4px;
            }

            /* ── Save button ── */
            #btn-save {
                position: fixed;
                top: 22px;
                right: 28px;
                z-index: 20;
                font-family: "Share Tech Mono", monospace;
                font-size: 8px;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                padding: 8px 14px;
                border: 1px solid var(--border);
                background: var(--ui-bg);
                color: var(--text-dim);
                cursor: pointer;
                border-radius: 4px;
                backdrop-filter: blur(14px);
                transition: all 0.15s;
            }
            #btn-save:hover {
                border-color: var(--purple);
                color: var(--purple);
                background: rgba(106, 13, 173, 0.05);
            }
        </style>
    </head>
    <body>
        <div id="canvas-wrap">
            <canvas id="gl"></canvas>
        </div>

        <div id="title-mark">
            <div class="t1">Harmonograph</div>
            <div class="t2">Phase Space Explorer</div>
        </div>

        <div id="mode-bar">
            <button class="mode-pill active" data-mode="0">Lissajous</button>
            <button class="mode-pill" data-mode="1">Brownian</button>
            <button class="mode-pill" data-mode="2">Lorenz</button>
            <button class="mode-pill" data-mode="3">Strange</button>
        </div>

        <div id="mode-desc">
            Deterministic Lissajous figure with harmonograph decay
        </div>

        <button id="btn-save">Save PNG</button>

        <div id="info-bar">
            fx <span id="disp-fx">3</span>
            <span class="sep">·</span>
            fy <span id="disp-fy">2</span>
            <span class="sep">·</span>
            φ <span id="disp-phase">0.50</span>π
            <span class="sep">·</span>
            mode <span id="disp-mode">LISS</span>
        </div>

        <script>
            // ════════════════════════════════════════════════════════════
            //  FIXED PARAMETERS
            // ════════════════════════════════════════════════════════════
            const state = {
                fx: 3,
                fy: 2,
                phase: Math.PI * 0.5,
                drift: 0.0022,
                d1: 0.0018,
                d2: 0.0022,
                iters: 60000,
                speed: 0.045,
                glowR: 0.007,
                persist: 0.91,
                bright: 2.2,
                noiseAmp: 0.032,
                noiseSpeed: 1.1,
                t: 0,
                paused: false,
                curveMode: 0,
            };

            // ── Purple palette — deep violet to soft lavender along the curve ──
            function purpleColor(normI, alpha) {
                const r = 0.38 + normI * 0.28;
                const g = 0.02 + normI * 0.1;
                const b = 0.65 + normI * 0.22;
                return [r, g, b, alpha];
            }

            // ── Seeded PRNG (Mulberry32) ──
            function mulberry32(seed) {
                return function () {
                    seed |= 0;
                    seed = (seed + 0x6d2b79f5) | 0;
                    let t2 = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                    t2 = (t2 + Math.imul(t2 ^ (t2 >>> 7), 61 | t2)) ^ t2;
                    return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296;
                };
            }

            // ── Smooth noise via cubic Hermite interpolation ──
            function makeNoise1D(seed, size = 4096) {
                const rng = mulberry32(seed);
                const table = new Float32Array(size);
                for (let i = 0; i < size; i++) table[i] = rng() * 2 - 1;
                return (t) => {
                    const idx = (((t * 0.1) % size) + size) % size;
                    const i0 = Math.floor(idx) % size;
                    const i1 = (i0 + 1) % size;
                    const f = idx - Math.floor(idx);
                    const a = table[i0],
                        b = table[i1];
                    return a + (b - a) * (3 * f * f - 2 * f * f * f);
                };
            }
            const noise1 = makeNoise1D(42);
            const noise2 = makeNoise1D(137);
            const noise3 = makeNoise1D(271);
            const noise4 = makeNoise1D(999);

            // ── Lorenz attractor (pre-integrated, normalized to [-0.88, 0.88]) ──
            const lorenzX = [],
                lorenzY = [];
            (function buildLorenz() {
                let x = 0.1,
                    y = 0,
                    z = 0;
                const sig = 10,
                    rho = 28,
                    bet = 8 / 3,
                    dt = 0.005;
                // burn-in
                for (let i = 0; i < 2000; i++) {
                    const dx = sig * (y - x),
                        dy = x * (rho - z) - y,
                        dz = x * y - bet * z;
                    x += dx * dt;
                    y += dy * dt;
                    z += dz * dt;
                }
                let mnX = Infinity,
                    mxX = -Infinity,
                    mnZ = Infinity,
                    mxZ = -Infinity;
                const tx = [],
                    tz = [];
                for (let i = 0; i < 120000; i++) {
                    const dx = sig * (y - x),
                        dy = x * (rho - z) - y,
                        dz = x * y - bet * z;
                    x += dx * dt;
                    y += dy * dt;
                    z += dz * dt;
                    tx.push(x);
                    tz.push(z);
                    if (x < mnX) mnX = x;
                    if (x > mxX) mxX = x;
                    if (z < mnZ) mnZ = z;
                    if (z > mxZ) mxZ = z;
                }
                const scX = 2 / (mxX - mnX),
                    scZ = 2 / (mxZ - mnZ);
                const midX = (mnX + mxX) / 2,
                    midZ = (mnZ + mxZ) / 2;
                for (let i = 0; i < tx.length; i++) {
                    lorenzX.push((tx[i] - midX) * scX * 0.88);
                    lorenzY.push((tz[i] - midZ) * scZ * 0.88);
                }
            })();

            // ════════════════════════════════════════════════════════════
            //  WEBGL SETUP
            // ════════════════════════════════════════════════════════════
            const canvas = document.getElementById("gl");
            const gl = canvas.getContext("webgl", {
                antialias: false,
                alpha: false,
                preserveDrawingBuffer: true,
            });

            function resize() {
                const size =
                    (Math.min(window.innerWidth, window.innerHeight) * 0.82) |
                    0;
                canvas.width = canvas.height = size;
                canvas.style.width = size + "px";
                canvas.style.height = size + "px";
                gl.viewport(0, 0, size, size);
            }
            window.addEventListener("resize", () => {
                resize();
                resetFB();
            });

            function makeShader(src, type) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
                    console.error(gl.getShaderInfoLog(s));
                return s;
            }
            function makeProgram(vs, fs) {
                const p = gl.createProgram();
                gl.attachShader(p, makeShader(vs, gl.VERTEX_SHADER));
                gl.attachShader(p, makeShader(fs, gl.FRAGMENT_SHADER));
                gl.linkProgram(p);
                return p;
            }

            // Curve program
            const curveProg = makeProgram(
                `
  attribute vec2 a_pos;
  attribute vec4 a_col;
  varying vec4 v_col;
  void main() {
    gl_Position = vec4(a_pos, 0.0, 1.0);
    v_col = a_col;
  }`,
                `precision mediump float;
  varying vec4 v_col;
  void main() { gl_FragColor = v_col; }`,
            );

            // Shared quad VS
            const QUAD_VS = `
  attribute vec2 a_pos;
  varying vec2 v_uv;
  void main() {
    gl_Position = vec4(a_pos, 0.0, 1.0);
    v_uv = a_pos * 0.5 + 0.5;
  }`;

            // Feedback decay program
            const fbProg = makeProgram(
                QUAD_VS,
                `
  precision mediump float;
  uniform sampler2D u_prev;
  uniform float u_persist;
  varying vec2 v_uv;
  void main() {
    vec4 c = texture2D(u_prev, v_uv);
    gl_FragColor = vec4(c.rgb * u_persist, c.a * u_persist);
  }`,
            );

            // Post-process: bloom + invert for white background
            const postProg = makeProgram(
                QUAD_VS,
                `
  precision mediump float;
  uniform sampler2D u_tex;
  uniform float u_bright;
  uniform float u_glow;
  varying vec2 v_uv;
  void main() {
    vec2 uv = v_uv;
    vec4 c = texture2D(u_tex, uv);

    // 7x7 Gaussian bloom
    vec4 bloom = vec4(0.0);
    float wsum = 0.0;
    for (int i = -3; i <= 3; i++) {
      for (int j = -3; j <= 3; j++) {
        float d = float(i*i + j*j);
        float w = exp(-d * u_glow * 180.0);
        bloom += texture2D(u_tex, uv + vec2(float(i), float(j)) * u_glow) * w;
        wsum += w;
      }
    }
    bloom /= wsum;

    vec4 result = c + bloom * 0.55;
    result.rgb *= u_bright;

    // Tone-map
    result.rgb = 1.0 - exp(-result.rgb * 1.4);

    // Subtle vignette on black buffer
    float vd = length(uv - 0.5) * 1.6;
    result.rgb *= 1.0 - vd * vd * 0.22;

    // Invert: dark purple lines on white canvas
    // result.rgb = 1.0 - result.rgb;

    gl_FragColor = vec4(result.rgb, 1.0);
  }`,
            );

            // Quad (full-screen triangle strip)
            const quadBuf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
            gl.bufferData(
                gl.ARRAY_BUFFER,
                new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
                gl.STATIC_DRAW,
            );

            // Curve vertex buffers
            const N = 120000;
            const posBuf = gl.createBuffer();
            const colBuf = gl.createBuffer();
            const posArr = new Float32Array(N * 2);
            const colArr = new Float32Array(N * 4);

            // Ping-pong framebuffers
            let fbA, fbB, texA, texB;

            function makeTexFB() {
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_MIN_FILTER,
                    gl.LINEAR,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_MAG_FILTER,
                    gl.LINEAR,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_WRAP_S,
                    gl.CLAMP_TO_EDGE,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_WRAP_T,
                    gl.CLAMP_TO_EDGE,
                );
                gl.texImage2D(
                    gl.TEXTURE_2D,
                    0,
                    gl.RGBA,
                    canvas.width,
                    canvas.height,
                    0,
                    gl.RGBA,
                    gl.UNSIGNED_BYTE,
                    null,
                );
                const fb = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.framebufferTexture2D(
                    gl.FRAMEBUFFER,
                    gl.COLOR_ATTACHMENT0,
                    gl.TEXTURE_2D,
                    tex,
                    0,
                );
                return { tex, fb };
            }
            function clearFB(fb) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
            }
            function resetFB() {
                const a = makeTexFB();
                texA = a.tex;
                fbA = a.fb;
                const b = makeTexFB();
                texB = b.tex;
                fbB = b.fb;
                clearFB(fbA);
                clearFB(fbB);
            }

            resize();
            resetFB();

            // ════════════════════════════════════════════════════════════
            //  CURVE GENERATION  — dispatches to 4 modes
            // ════════════════════════════════════════════════════════════
            function buildCurve() {
                const {
                    fx,
                    fy,
                    phase,
                    d1,
                    d2,
                    iters,
                    t: T,
                    curveMode,
                    noiseAmp,
                    noiseSpeed,
                    drift,
                    speed,
                } = state;
                let n = Math.min(iters, N);

                if (curveMode === 0) {
                    // ── LISSAJOUS / HARMONOGRAPH ──
                    for (let i = 0; i < n; i++) {
                        const tt = i * speed;
                        const decay = Math.exp(-(d1 + d2) * tt);
                        const x = decay * Math.sin(fx * tt + phase + drift * T);
                        const y = decay * Math.sin(fy * tt);
                        const ni = i / n;
                        const alpha =
                            Math.pow(1 - ni, 0.3) * 0.75 * (0.3 + decay * 0.7);
                        const [r, g, b, a] = purpleColor(ni, alpha);
                        posArr[i * 2] = x;
                        posArr[i * 2 + 1] = y;
                        colArr[i * 4] = r;
                        colArr[i * 4 + 1] = g;
                        colArr[i * 4 + 2] = b;
                        colArr[i * 4 + 3] = a;
                    }
                } else if (curveMode === 1) {
                    // ── BROWNIAN HARMONOGRAPH ──
                    for (let i = 0; i < n; i++) {
                        const tt = i * speed * 0.8;
                        const decay = Math.exp(-(d1 + d2) * tt);
                        const nFx =
                            fx +
                            noiseAmp * 90 * noise1(tt * noiseSpeed + T * 0.003);
                        const nFy =
                            fy +
                            noiseAmp *
                                90 *
                                noise2(tt * noiseSpeed * 1.3 + T * 0.003 + 10);
                        const nPh =
                            phase +
                            noiseAmp *
                                22 *
                                noise3(tt * noiseSpeed * 0.7 + T * 0.002 + 20) +
                            drift * T;
                        const x = decay * Math.sin(nFx * tt + nPh);
                        const y =
                            decay *
                            Math.sin(
                                nFy * tt +
                                    noiseAmp *
                                        18 *
                                        noise4(tt * noiseSpeed * 0.9),
                            );
                        const ni = i / n;
                        const alpha =
                            Math.pow(1 - ni, 0.2) * 0.8 * (0.2 + decay * 0.8);
                        const [r, g, b, a] = purpleColor(ni, alpha);
                        posArr[i * 2] = x;
                        posArr[i * 2 + 1] = y;
                        colArr[i * 4] = r;
                        colArr[i * 4 + 1] = g;
                        colArr[i * 4 + 2] = b;
                        colArr[i * 4 + 3] = a;
                    }
                } else if (curveMode === 2) {
                    // ── LORENZ ATTRACTOR (xz projection) ──
                    const offset = (T * 15) % lorenzX.length;
                    for (let i = 0; i < n; i++) {
                        const idx = (offset + i) % lorenzX.length;
                        const decay = Math.exp(-(d1 + d2) * i * speed * 0.5);
                        const x = lorenzX[idx] * (0.3 + decay * 0.7);
                        const y = lorenzY[idx] * (0.3 + decay * 0.7);
                        const ni = i / n;
                        const alpha = Math.pow(1 - ni, 0.12) * 0.65;
                        const [r, g, b, a] = purpleColor(
                            ni * 0.5 + (idx / lorenzX.length) * 0.5,
                            alpha,
                        );
                        posArr[i * 2] = x;
                        posArr[i * 2 + 1] = y;
                        colArr[i * 4] = r;
                        colArr[i * 4 + 1] = g;
                        colArr[i * 4 + 2] = b;
                        colArr[i * 4 + 3] = a;
                    }
                } else if (curveMode === 3) {
                    // ── STRANGE: irrational (φ, e) ratios + phase noise ──
                    const PHI = (1 + Math.sqrt(5)) / 2; // golden ratio
                    const E = Math.E;
                    for (let i = 0; i < n; i++) {
                        const tt = i * speed * 0.5;
                        const decay = Math.exp(-(d1 + d2) * tt);
                        const pn1 =
                            noise1(tt * noiseSpeed * 0.3 + T * 0.0012) *
                            noiseAmp *
                            14;
                        const pn2 =
                            noise2(tt * noiseSpeed * 0.4 + T * 0.0016 + 5) *
                            noiseAmp *
                            14;
                        const fxEff = fx * PHI + pn1 * drift * 220;
                        const fyEff = fy * E + pn2 * drift * 220;
                        const x =
                            decay * Math.sin(fxEff * tt + phase + drift * T);
                        const y = decay * Math.sin(fyEff * tt + pn1);
                        const ni = i / n;
                        const alpha =
                            Math.pow(1 - ni, 0.18) * 0.85 * (0.2 + decay * 0.8);
                        const [r, g, b, a] = purpleColor(ni, alpha);
                        posArr[i * 2] = x;
                        posArr[i * 2 + 1] = y;
                        colArr[i * 4] = r;
                        colArr[i * 4 + 1] = g;
                        colArr[i * 4 + 2] = b;
                        colArr[i * 4 + 3] = a;
                    }
                }

                gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
                gl.bufferData(
                    gl.ARRAY_BUFFER,
                    posArr.subarray(0, n * 2),
                    gl.STREAM_DRAW,
                );
                gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
                gl.bufferData(
                    gl.ARRAY_BUFFER,
                    colArr.subarray(0, n * 4),
                    gl.STREAM_DRAW,
                );
                return n;
            }

            // ════════════════════════════════════════════════════════════
            //  RENDER LOOP
            // ════════════════════════════════════════════════════════════
            function drawQuad(prog) {
                const loc = gl.getAttribLocation(prog, "a_pos");
                gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
                gl.enableVertexAttribArray(loc);
                gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            }

            function render() {
                if (!state.paused) state.t += 1;

                const n = buildCurve();

                // Pass 1 — feedback decay: fbA → fbB
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbB);
                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.useProgram(fbProg);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, texA);
                gl.uniform1i(gl.getUniformLocation(fbProg, "u_prev"), 0);
                gl.uniform1f(
                    gl.getUniformLocation(fbProg, "u_persist"),
                    state.persist,
                );
                drawQuad(fbProg);

                // Pass 2 — draw curve into fbB (additive blending)
                gl.useProgram(curveProg);
                gl.enable(gl.BLEND);
                gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

                gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
                gl.enableVertexAttribArray(
                    gl.getAttribLocation(curveProg, "a_pos"),
                );
                gl.vertexAttribPointer(
                    gl.getAttribLocation(curveProg, "a_pos"),
                    2,
                    gl.FLOAT,
                    false,
                    0,
                    0,
                );

                gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
                gl.enableVertexAttribArray(
                    gl.getAttribLocation(curveProg, "a_col"),
                );
                gl.vertexAttribPointer(
                    gl.getAttribLocation(curveProg, "a_col"),
                    4,
                    gl.FLOAT,
                    false,
                    0,
                    0,
                );

                gl.drawArrays(gl.LINE_STRIP, 0, n);
                gl.disable(gl.BLEND);

                // Swap ping-pong buffers
                [fbA, fbB] = [fbB, fbA];
                [texA, texB] = [texB, texA];

                // Pass 3 — bloom + invert → white background screen output
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(1, 1, 1, 1);
                gl.clear(gl.COLOR_BUFFER_BIT);

                gl.useProgram(postProg);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, texA);
                gl.uniform1i(gl.getUniformLocation(postProg, "u_tex"), 0);
                gl.uniform1f(
                    gl.getUniformLocation(postProg, "u_bright"),
                    state.bright,
                );
                gl.uniform1f(
                    gl.getUniformLocation(postProg, "u_glow"),
                    state.glowR,
                );
                drawQuad(postProg);

                // Update HUD
                const NAMES = ["LISS", "BROW", "LORZ", "STRG"];
                document.getElementById("disp-fx").textContent = state.fx;
                document.getElementById("disp-fy").textContent = state.fy;
                document.getElementById("disp-phase").textContent = (
                    state.phase / Math.PI
                ).toFixed(2);
                document.getElementById("disp-mode").textContent =
                    NAMES[state.curveMode];

                requestAnimationFrame(render);
            }

            // ════════════════════════════════════════════════════════════
            //  UI
            // ════════════════════════════════════════════════════════════
            const MODE_DESCS = [
                "Deterministic Lissajous figure with harmonograph decay",
                "Frequency modulated by smooth noise — a curve that wanders",
                "Lorenz strange attractor, xz-projection, animated in time",
                "Irrational ratios φ·fₓ, e·f_y — never closes, never repeats",
            ];

            document
                .getElementById("mode-bar")
                .addEventListener("click", (e) => {
                    const btn = e.target.closest(".mode-pill");
                    if (!btn) return;
                    const m = parseInt(btn.dataset.mode);
                    state.curveMode = m;
                    document
                        .querySelectorAll(".mode-pill")
                        .forEach((x) =>
                            x.classList.toggle("active", x === btn),
                        );
                    document.getElementById("mode-desc").textContent =
                        MODE_DESCS[m];
                    clearFB(fbA);
                    clearFB(fbB);
                    state.t = 0;
                });

            document
                .getElementById("btn-save")
                .addEventListener("click", () => {
                    const modeNames = [
                        "lissajous",
                        "brownian",
                        "lorenz",
                        "strange",
                    ];
                    const link = document.createElement("a");
                    link.download = `harmonograph_${modeNames[state.curveMode]}_${Date.now()}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                });

            // ════════════════════════════════════════════════════════════
            //  GO
            // ════════════════════════════════════════════════════════════
            requestAnimationFrame(render);
        </script>
    </body>
</html>
