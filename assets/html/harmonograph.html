<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Harmonograph</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Share+Tech+Mono&display=swap"
            rel="stylesheet" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #faf7fb;
                --bg-ambient: #f3ebf7;
                --paper: #fffdfd;
                --paper-edge: rgba(181, 9, 172, 0.12);
                --purple: #b509ac;
                --purple-soft: rgba(181, 9, 172, 0.18);
                --text: #26182f;
                --text-dim: rgba(38, 24, 47, 0.58);
                --ui-bg: rgba(255, 252, 255, 0.74);
                --ui-shadow: 0 18px 40px rgba(32, 17, 41, 0.12);
                --canvas-shadow: 0 28px 70px rgba(34, 13, 41, 0.18);
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background:
                    radial-gradient(
                        circle at top left,
                        var(--purple-soft),
                        transparent 36%
                    ),
                    radial-gradient(
                        circle at bottom right,
                        rgba(181, 9, 172, 0.08),
                        transparent 28%
                    ),
                    linear-gradient(
                        180deg,
                        var(--bg-ambient),
                        var(--bg) 32%,
                        var(--paper)
                    );
                color: var(--text);
            }

            body {
                position: relative;
                font-family: "Cormorant Garamond", serif;
            }

            #canvas-wrap {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: clamp(6rem, 10vh, 7.25rem) clamp(1rem, 3vw, 2rem)
                    clamp(7rem, 12vh, 8.5rem);
            }

            #canvas-wrap::before {
                content: "";
                position: absolute;
                width: min(72vmin, 680px);
                height: min(72vmin, 680px);
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(181, 9, 172, 0.08),
                    transparent 68%
                );
                filter: blur(12px);
                opacity: 0.9;
                pointer-events: none;
            }

            canvas#gl {
                position: relative;
                display: block;
                border-radius: 28px;
                border: 1px solid var(--paper-edge);
                background: var(--paper);
                box-shadow: var(--canvas-shadow);
            }

            #mode-bar,
            #info-bar {
                z-index: 20;
                border: 1px solid var(--paper-edge);
                background: var(--ui-bg);
                backdrop-filter: blur(18px);
                box-shadow: var(--ui-shadow);
            }

            #mode-bar {
                position: fixed;
                top: 24px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 4px;
                width: min(calc(100% - 2rem), 540px);
                padding: 6px;
                border-radius: 999px;
            }

            .mode-pill {
                font-family: "Share Tech Mono", monospace;
                font-size: 9px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                padding: 0.78rem 1.05rem;
                border-radius: 999px;
                border: none;
                background: transparent;
                color: var(--text-dim);
                cursor: pointer;
                transition:
                    transform 0.2s ease,
                    background 0.2s ease,
                    color 0.2s ease,
                    box-shadow 0.2s ease;
                white-space: nowrap;
            }

            .mode-pill:hover {
                color: var(--purple);
                transform: translateY(-1px);
            }

            .mode-pill.active {
                background: linear-gradient(135deg, var(--purple), #d264cb);
                color: #fff;
                box-shadow: 0 12px 24px rgba(181, 9, 172, 0.28);
            }

            #mode-desc {
                position: fixed;
                bottom: 78px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 20;
                width: min(calc(100% - 2rem), 560px);
                font-style: italic;
                font-weight: 300;
                font-size: clamp(14px, 2vw, 17px);
                color: var(--text-dim);
                letter-spacing: 0.03em;
                text-align: center;
                pointer-events: none;
            }

            #info-bar {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 0.85rem;
                width: fit-content;
                max-width: calc(100% - 2rem);
                padding: 0.9rem 1.25rem;
                border-radius: 999px;
                font-family: "Share Tech Mono", monospace;
                font-size: 9px;
                letter-spacing: 0.2em;
                color: var(--text-dim);
                pointer-events: none;
            }

            #info-bar .sep {
                opacity: 0.3;
            }

            #info-bar span {
                color: var(--purple);
            }

            #title-mark {
                position: fixed;
                top: 30px;
                left: 30px;
                z-index: 20;
                pointer-events: none;
                padding: 0.9rem 1rem 0.8rem;
                border: 1px solid var(--paper-edge);
                border-radius: 20px;
                background: var(--ui-bg);
                backdrop-filter: blur(18px);
                box-shadow: var(--ui-shadow);
            }

            #title-mark .eyebrow {
                font-family: "Share Tech Mono", monospace;
                font-size: 8px;
                letter-spacing: 0.24em;
                color: var(--text-dim);
                text-transform: uppercase;
                margin-bottom: 0.45rem;
            }

            #title-mark .t1 {
                font-style: italic;
                font-weight: 300;
                font-size: clamp(24px, 3vw, 30px);
                color: var(--text);
                letter-spacing: 0.03em;
                line-height: 0.95;
            }

            #title-mark .t2 {
                font-size: 14px;
                color: var(--text-dim);
                letter-spacing: 0.04em;
                margin-top: 0.28rem;
            }

            @media (max-width: 780px) {
                #canvas-wrap {
                    padding-top: 7.9rem;
                    padding-bottom: 8.75rem;
                }

                #title-mark {
                    top: 18px;
                    left: 16px;
                    right: 16px;
                    padding: 0.8rem 0.9rem;
                }

                #mode-bar {
                    top: auto;
                    bottom: 132px;
                    width: min(calc(100% - 1rem), 560px);
                }

                #mode-desc {
                    bottom: 90px;
                    width: min(calc(100% - 1.2rem), 520px);
                    font-size: 14px;
                }

                #info-bar {
                    bottom: 14px;
                    gap: 0.65rem;
                    padding: 0.85rem 1rem;
                }
            }

            @media (max-width: 560px) {
                #canvas-wrap {
                    padding: 8rem 0.75rem 9.5rem;
                }

                canvas#gl {
                    border-radius: 22px;
                }

                #mode-bar {
                    bottom: 126px;
                    border-radius: 24px;
                }

                .mode-pill {
                    flex: 1 1 calc(50% - 0.25rem);
                    padding: 0.74rem 0.8rem;
                }

                #mode-desc {
                    bottom: 84px;
                }

                #info-bar {
                    border-radius: 24px;
                    width: min(calc(100% - 1rem), 420px);
                }

                #info-bar .sep {
                    display: none;
                }
            }

            /* ── Save button ── */

                position: fixed;
                top: 22px;

                letter-spacing: 0.22em;
                text-transform: uppercase;
                padding: 8px 14px;
                border: 1px solid var(--border);
                background: var(--ui-bg);
                color: var(--text-dim);
                cursor: pointer;
                border-radius: 4px;
                backdrop-filter: blur(14px);
                transition: all 0.15s;
            }
            #btn-save:hover {
                border-color: var(--purple);
                color: var(--purple);
                background: rgba(106, 13, 173, 0.05);
            } */
        </style>
    </head>
    <body>
        <div id="canvas-wrap">
            <canvas id="gl"></canvas>
        </div>

        <div id="title-mark">
            <div class="eyebrow">Generative Study</div>
            <div class="t1">Harmonograph</div>
            <div class="t2">Oscillators and strange attractors</div>
        </div>

        <div id="mode-bar">
            <button class="mode-pill active" data-mode="0">Lissajous</button>
            <button class="mode-pill" data-mode="1">Brownian</button>
            <button class="mode-pill" data-mode="2">Lorenz</button>
            <button class="mode-pill" data-mode="3">Strange</button>
        </div>

        <div id="mode-desc">
            Deterministic Lissajous figure with harmonograph decay
        </div>

        <!-- <button id="btn-save">Save PNG</button> -->

        <div id="info-bar">
            fx <span id="disp-fx">3</span>
            <span class="sep">·</span>
            fy <span id="disp-fy">2</span>
            <span class="sep">·</span>
            φ <span id="disp-phase">0.50</span>π
            <span class="sep">·</span>
            mode <span id="disp-mode">LISS</span>
        </div>

        <script>
            // ════════════════════════════════════════════════════════════
            //  FIXED PARAMETERS
            // ════════════════════════════════════════════════════════════
            const state = {
                fx: 3,
                fy: 2,
                phase: Math.PI * 0.5,
                drift: 0.0022,
                d1: 0.0018,
                d2: 0.0022,
                iters: 60000,
                speed: 0.045,
                glowR: 0.007,
                persist: 0.0,
                bright: 2.2,
                noiseAmp: 0.032,
                noiseSpeed: 1.1,
                t: 0,
                paused: false,
                curveMode: 0,
            };

            const wrap = document.getElementById("canvas-wrap");
            const root = document.documentElement;
            const theme = {
                bg01: [0.98, 0.97, 0.99],
                paper01: [1, 0.99, 0.99],
            };

            function clamp01(value) {
                return Math.max(0, Math.min(1, value));
            }

            function hexToRgb(hex) {
                const trimmed = hex.trim();
                const rgbMatch = trimmed.match(
                    /^rgba?\((\d+),\s*(\d+),\s*(\d+)/i,
                );
                if (rgbMatch) {
                    return [
                        Number(rgbMatch[1]),
                        Number(rgbMatch[2]),
                        Number(rgbMatch[3]),
                    ];
                }
                const normalized = trimmed.replace("#", "");
                const compact =
                    normalized.length === 3
                        ? normalized
                              .split("")
                              .map((char) => char + char)
                              .join("")
                        : normalized;
                if (!/^[0-9a-fA-F]{6}$/.test(compact)) return [255, 255, 255];
                return [
                    parseInt(compact.slice(0, 2), 16),
                    parseInt(compact.slice(2, 4), 16),
                    parseInt(compact.slice(4, 6), 16),
                ];
            }

            function mixRgb(a, b, t) {
                return a.map((channel, i) =>
                    Math.round(channel + (b[i] - channel) * t),
                );
            }

            function rgbString(rgb) {
                return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
            }

            function rgbaString(rgb, alpha) {
                return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
            }

            function rgb255To01(rgb) {
                return rgb.map((channel) => channel / 255);
            }

            function lerp(a, b, t) {
                return a + (b - a) * t;
            }

            function mix01(a, b, t) {
                return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
            }

            function applyThemeFromParent() {
                try {
                    const hostRoot =
                        window.parent && window.parent !== window
                            ? window.parent.document.documentElement
                            : document.documentElement;
                    const styles = getComputedStyle(hostRoot);
                    const bg = hexToRgb(
                        styles.getPropertyValue("--global-bg-color") || "#ffffff",
                    );
                    const text = hexToRgb(
                        styles.getPropertyValue("--global-text-color") || "#1c1c1d",
                    );
                    const accent = hexToRgb(
                        styles.getPropertyValue("--global-theme-color") || "#b509ac",
                    );
                    const dark = hostRoot.dataset.theme === "dark";
                    const white = [255, 255, 255];

                    const ambient = dark
                        ? mixRgb(bg, accent, 0.14)
                        : mixRgb(bg, accent, 0.08);
                    const paper = dark ? mixRgb(bg, white, 0.08) : mixRgb(bg, white, 0.38);
                    const paperEdge = dark
                        ? rgbaString(accent, 0.28)
                        : rgbaString(accent, 0.16);
                    const uiBg = dark
                        ? rgbaString(mixRgb(bg, white, 0.08), 0.78)
                        : rgbaString(mixRgb(bg, white, 0.75), 0.74);
                    const textDim = dark
                        ? rgbaString(mixRgb(text, white, 0.18), 0.76)
                        : rgbaString(mixRgb(text, accent, 0.14), 0.62);

                    root.style.setProperty("--bg", rgbString(bg));
                    root.style.setProperty("--bg-ambient", rgbString(ambient));
                    root.style.setProperty("--paper", rgbString(paper));
                    root.style.setProperty("--paper-edge", paperEdge);
                    root.style.setProperty("--purple", rgbString(accent));
                    root.style.setProperty("--purple-soft", rgbaString(accent, dark ? 0.22 : 0.15));
                    root.style.setProperty("--text", rgbString(text));
                    root.style.setProperty("--text-dim", textDim);
                    root.style.setProperty("--ui-bg", uiBg);
                    root.style.setProperty(
                        "--ui-shadow",
                        dark
                            ? "0 18px 44px rgba(0, 0, 0, 0.36)"
                            : "0 18px 40px rgba(32, 17, 41, 0.12)",
                    );
                    root.style.setProperty(
                        "--canvas-shadow",
                        dark
                            ? "0 28px 70px rgba(0, 0, 0, 0.38)"
                            : "0 28px 70px rgba(34, 13, 41, 0.18)",
                    );

                    theme.bg01 = rgb255To01(bg);
                    theme.paper01 = rgb255To01(paper);

                    if (hostRoot !== document.documentElement && !applyThemeFromParent.bound) {
                        const observer = new MutationObserver(() => {
                            applyThemeFromParent();
                        });
                        observer.observe(hostRoot, {
                            attributes: true,
                            attributeFilter: ["data-theme", "style", "class"],
                        });
                        applyThemeFromParent.bound = true;
                    }
                } catch (error) {
                    console.warn("Theme sync unavailable", error);
                }
            }
            applyThemeFromParent.bound = false;

            const MODE_PALETTES = [
                [
                    [0.28, 0.08, 0.4],
                    [0.61, 0.12, 0.63],
                    [0.93, 0.67, 0.9],
                ],
                [
                    [0.2, 0.11, 0.39],
                    [0.43, 0.21, 0.67],
                    [0.79, 0.77, 0.96],
                ],
                [
                    [0.1, 0.15, 0.38],
                    [0.2, 0.41, 0.69],
                    [0.69, 0.88, 0.98],
                ],
                [
                    [0.36, 0.09, 0.31],
                    [0.76, 0.21, 0.48],
                    [0.98, 0.82, 0.62],
                ],
            ];

            function curveColor(mode, normI, alpha) {
                const palette = MODE_PALETTES[mode] || MODE_PALETTES[0];
                const firstBlend = mix01(palette[0], palette[1], Math.pow(normI, 0.72));
                const finalColor = mix01(
                    firstBlend,
                    palette[2],
                    clamp01(Math.pow(normI, 1.18) * 0.95),
                );
                return [finalColor[0], finalColor[1], finalColor[2], alpha];
            }

            // ── Seeded PRNG (Mulberry32) ──
            function mulberry32(seed) {
                return function () {
                    seed |= 0;
                    seed = (seed + 0x6d2b79f5) | 0;
                    let t2 = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                    t2 = (t2 + Math.imul(t2 ^ (t2 >>> 7), 61 | t2)) ^ t2;
                    return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296;
                };
            }

            // ── Smooth noise via cubic Hermite interpolation ──
            function makeNoise1D(seed, size = 4096) {
                const rng = mulberry32(seed);
                const table = new Float32Array(size);
                for (let i = 0; i < size; i++) table[i] = rng() * 2 - 1;
                return (t) => {
                    const idx = (((t * 0.1) % size) + size) % size;
                    const i0 = Math.floor(idx) % size;
                    const i1 = (i0 + 1) % size;
                    const f = idx - Math.floor(idx);
                    const a = table[i0],
                        b = table[i1];
                    return a + (b - a) * (3 * f * f - 2 * f * f * f);
                };
            }
            const noise1 = makeNoise1D(42);
            const noise2 = makeNoise1D(137);
            const noise3 = makeNoise1D(271);
            const noise4 = makeNoise1D(999);

            // ── Lorenz attractor (pre-integrated, normalized to [-0.88, 0.88]) ──
            const lorenzX = [],
                lorenzY = [];
            (function buildLorenz() {
                let x = 0.1,
                    y = 0,
                    z = 0;
                const sig = 10,
                    rho = 28,
                    bet = 8 / 3,
                    dt = 0.005;
                // burn-in
                for (let i = 0; i < 2000; i++) {
                    const dx = sig * (y - x),
                        dy = x * (rho - z) - y,
                        dz = x * y - bet * z;
                    x += dx * dt;
                    y += dy * dt;
                    z += dz * dt;
                }
                let mnX = Infinity,
                    mxX = -Infinity,
                    mnZ = Infinity,
                    mxZ = -Infinity;
                const tx = [],
                    tz = [];
                for (let i = 0; i < 120000; i++) {
                    const dx = sig * (y - x),
                        dy = x * (rho - z) - y,
                        dz = x * y - bet * z;
                    x += dx * dt;
                    y += dy * dt;
                    z += dz * dt;
                    tx.push(x);
                    tz.push(z);
                    if (x < mnX) mnX = x;
                    if (x > mxX) mxX = x;
                    if (z < mnZ) mnZ = z;
                    if (z > mxZ) mxZ = z;
                }
                const scX = 2 / (mxX - mnX),
                    scZ = 2 / (mxZ - mnZ);
                const midX = (mnX + mxX) / 2,
                    midZ = (mnZ + mxZ) / 2;
                for (let i = 0; i < tx.length; i++) {
                    lorenzX.push((tx[i] - midX) * scX * 0.88);
                    lorenzY.push((tz[i] - midZ) * scZ * 0.88);
                }
            })();

            // ════════════════════════════════════════════════════════════
            //  WEBGL SETUP
            // ════════════════════════════════════════════════════════════
            const canvas = document.getElementById("gl");
            const gl = canvas.getContext("webgl", {
                antialias: false,
                alpha: false,
                preserveDrawingBuffer: true,
            });

            function resize() {
                const styles = getComputedStyle(wrap);
                const availableWidth =
                    wrap.clientWidth -
                    parseFloat(styles.paddingLeft) -
                    parseFloat(styles.paddingRight);
                const availableHeight =
                    wrap.clientHeight -
                    parseFloat(styles.paddingTop) -
                    parseFloat(styles.paddingBottom);
                const size = Math.max(
                    240,
                    Math.floor(Math.min(availableWidth, availableHeight)),
                );
                canvas.width = canvas.height = size;
                canvas.style.width = size + "px";
                canvas.style.height = size + "px";
                gl.viewport(0, 0, size, size);
            }
            window.addEventListener("resize", () => {
                resize();
                resetFB();
            });

            function makeShader(src, type) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
                    console.error(gl.getShaderInfoLog(s));
                return s;
            }
            function makeProgram(vs, fs) {
                const p = gl.createProgram();
                gl.attachShader(p, makeShader(vs, gl.VERTEX_SHADER));
                gl.attachShader(p, makeShader(fs, gl.FRAGMENT_SHADER));
                gl.linkProgram(p);
                return p;
            }

            // Curve program
            const curveProg = makeProgram(
                `
  attribute vec2 a_pos;
  attribute vec4 a_col;
  varying vec4 v_col;
  void main() {
    gl_Position = vec4(a_pos, 0.0, 1.0);
    v_col = a_col;
  }`,
                `precision mediump float;
  varying vec4 v_col;
  void main() { gl_FragColor = v_col; }`,
            );

            // Shared quad VS
            const QUAD_VS = `
  attribute vec2 a_pos;
  varying vec2 v_uv;
  void main() {
    gl_Position = vec4(a_pos, 0.0, 1.0);
    v_uv = a_pos * 0.5 + 0.5;
  }`;

            // Feedback decay program
            const fbProg = makeProgram(
                QUAD_VS,
                `
  precision mediump float;
  uniform sampler2D u_prev;
  uniform float u_persist;
  varying vec2 v_uv;
  void main() {
    vec4 c = texture2D(u_prev, v_uv);
    gl_FragColor = vec4(c.rgb * u_persist, c.a * u_persist);
  }`,
            );

            // Post-process: bloom + invert for white background
            const postProg = makeProgram(
                QUAD_VS,
                `
  precision mediump float;
  uniform sampler2D u_tex;
  uniform float u_bright;
  uniform float u_glow;
  uniform vec3 u_bg;
  varying vec2 v_uv;
  void main() {
    vec2 uv = v_uv;
    vec4 c = texture2D(u_tex, uv);

    // 7x7 Gaussian bloom
    vec4 bloom = vec4(0.0);
    float wsum = 0.0;
    for (int i = -3; i <= 3; i++) {
      for (int j = -3; j <= 3; j++) {
        float d = float(i*i + j*j);
        float w = exp(-d * u_glow * 180.0);
        bloom += texture2D(u_tex, uv + vec2(float(i), float(j)) * u_glow) * w;
        wsum += w;
      }
    }
    bloom /= wsum;

    vec4 result = c + bloom * 0.55;
    result.rgb *= u_bright;

    // Tone-map
    result.rgb = 1.0 - exp(-result.rgb * 1.4);

    // Subtle vignette on black buffer
    float vd = length(uv - 0.5) * 1.6;
    result.rgb *= 1.0 - vd * vd * 0.22;

    vec3 paper = u_bg + vec3(0.012, 0.008, 0.016);
    vec3 ink = result.rgb;
    vec3 toned = max(paper - ink * 0.86, vec3(0.0));

    gl_FragColor = vec4(toned, 1.0);
  }`,
            );

            // Quad (full-screen triangle strip)
            const quadBuf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
            gl.bufferData(
                gl.ARRAY_BUFFER,
                new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
                gl.STATIC_DRAW,
            );

            // Curve vertex buffers
            const N = 120000;
            const posBuf = gl.createBuffer();
            const colBuf = gl.createBuffer();
            const posArr = new Float32Array(N * 2);
            const colArr = new Float32Array(N * 4);

            // Ping-pong framebuffers
            let fbA, fbB, texA, texB;

            function makeTexFB() {
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_MIN_FILTER,
                    gl.LINEAR,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_MAG_FILTER,
                    gl.LINEAR,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_WRAP_S,
                    gl.CLAMP_TO_EDGE,
                );
                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_WRAP_T,
                    gl.CLAMP_TO_EDGE,
                );
                gl.texImage2D(
                    gl.TEXTURE_2D,
                    0,
                    gl.RGBA,
                    canvas.width,
                    canvas.height,
                    0,
                    gl.RGBA,
                    gl.UNSIGNED_BYTE,
                    null,
                );
                const fb = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.framebufferTexture2D(
                    gl.FRAMEBUFFER,
                    gl.COLOR_ATTACHMENT0,
                    gl.TEXTURE_2D,
                    tex,
                    0,
                );
                return { tex, fb };
            }
            function clearFB(fb) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
            }
            function resetFB() {
                const a = makeTexFB();
                texA = a.tex;
                fbA = a.fb;
                const b = makeTexFB();
                texB = b.tex;
                fbB = b.fb;
                clearFB(fbA);
                clearFB(fbB);
            }

            applyThemeFromParent();
            resize();
            resetFB();

            // ════════════════════════════════════════════════════════════
            //  CURVE GENERATION  — dispatches to 4 modes
            // ════════════════════════════════════════════════════════════
            function buildCurve() {
                const {
                    fx,
                    fy,
                    phase,
                    d1,
                    d2,
                    iters,
                    t: T,
                    curveMode,
                    noiseAmp,
                    noiseSpeed,
                    drift,
                    speed,
                } = state;
                let n = Math.min(iters, N);

                if (curveMode === 0) {
                    // ── LISSAJOUS / HARMONOGRAPH ──
                    for (let i = 0; i < n; i++) {
                        const tt = i * speed;
                        const decay = Math.exp(-(d1 + d2) * tt);
                        const x = decay * Math.sin(fx * tt + phase + drift * T);
                        const y = decay * Math.sin(fy * tt);
                        const ni = i / n;
                        const alpha =
                            Math.pow(1 - ni, 0.3) * 0.75 * (0.3 + decay * 0.7);
                        const [r, g, b, a] = curveColor(curveMode, ni, alpha);
                        posArr[i * 2] = x;
                        posArr[i * 2 + 1] = y;
                        colArr[i * 4] = r;
                        colArr[i * 4 + 1] = g;
                        colArr[i * 4 + 2] = b;
                        colArr[i * 4 + 3] = a;
                    }
                } else if (curveMode === 1) {
                    // ── BROWNIAN HARMONOGRAPH ──
                    for (let i = 0; i < n; i++) {
                        const tt = i * speed * 0.8;
                        const decay = Math.exp(-(d1 + d2) * tt);
                        const nFx =
                            fx +
                            noiseAmp * 90 * noise1(tt * noiseSpeed + T * 0.003);
                        const nFy =
                            fy +
                            noiseAmp *
                                90 *
                                noise2(tt * noiseSpeed * 1.3 + T * 0.003 + 10);
                        const nPh =
                            phase +
                            noiseAmp *
                                22 *
                                noise3(tt * noiseSpeed * 0.7 + T * 0.002 + 20) +
                            drift * T;
                        const x = decay * Math.sin(nFx * tt + nPh);
                        const y =
                            decay *
                            Math.sin(
                                nFy * tt +
                                    noiseAmp *
                                        18 *
                                        noise4(tt * noiseSpeed * 0.9),
                            );
                        const ni = i / n;
                        const alpha =
                            Math.pow(1 - ni, 0.2) * 0.8 * (0.2 + decay * 0.8);
                        const [r, g, b, a] = curveColor(curveMode, ni, alpha);
                        posArr[i * 2] = x;
                        posArr[i * 2 + 1] = y;
                        colArr[i * 4] = r;
                        colArr[i * 4 + 1] = g;
                        colArr[i * 4 + 2] = b;
                        colArr[i * 4 + 3] = a;
                    }
                } else if (curveMode === 2) {
                    // ── LORENZ ATTRACTOR (xz projection) ──
                    const offset = (T * 15) % lorenzX.length;
                    for (let i = 0; i < n; i++) {
                        const idx = (offset + i) % lorenzX.length;
                        const decay = Math.exp(-(d1 + d2) * i * speed * 0.5);
                        const x = lorenzX[idx] * (0.3 + decay * 0.7);
                        const y = lorenzY[idx] * (0.3 + decay * 0.7);
                        const ni = i / n;
                        const alpha = Math.pow(1 - ni, 0.12) * 0.65;
                        const [r, g, b, a] = curveColor(
                            curveMode,
                            ni * 0.5 + (idx / lorenzX.length) * 0.5,
                            alpha,
                        );
                        posArr[i * 2] = x;
                        posArr[i * 2 + 1] = y;
                        colArr[i * 4] = r;
                        colArr[i * 4 + 1] = g;
                        colArr[i * 4 + 2] = b;
                        colArr[i * 4 + 3] = a;
                    }
                } else if (curveMode === 3) {
                    // ── STRANGE: irrational (φ, e) ratios + phase noise ──
                    const PHI = (1 + Math.sqrt(5)) / 2; // golden ratio
                    const E = Math.E;
                    for (let i = 0; i < n; i++) {
                        const tt = i * speed * 0.5;
                        const decay = Math.exp(-(d1 + d2) * tt);
                        const pn1 =
                            noise1(tt * noiseSpeed * 0.3 + T * 0.0012) *
                            noiseAmp *
                            14;
                        const pn2 =
                            noise2(tt * noiseSpeed * 0.4 + T * 0.0016 + 5) *
                            noiseAmp *
                            14;
                        const fxEff = fx * PHI + pn1 * drift * 220;
                        const fyEff = fy * E + pn2 * drift * 220;
                        const x =
                            decay * Math.sin(fxEff * tt + phase + drift * T);
                        const y = decay * Math.sin(fyEff * tt + pn1);
                        const ni = i / n;
                        const alpha =
                            Math.pow(1 - ni, 0.18) * 0.85 * (0.2 + decay * 0.8);
                        const [r, g, b, a] = curveColor(curveMode, ni, alpha);
                        posArr[i * 2] = x;
                        posArr[i * 2 + 1] = y;
                        colArr[i * 4] = r;
                        colArr[i * 4 + 1] = g;
                        colArr[i * 4 + 2] = b;
                        colArr[i * 4 + 3] = a;
                    }
                }

                gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
                gl.bufferData(
                    gl.ARRAY_BUFFER,
                    posArr.subarray(0, n * 2),
                    gl.STREAM_DRAW,
                );
                gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
                gl.bufferData(
                    gl.ARRAY_BUFFER,
                    colArr.subarray(0, n * 4),
                    gl.STREAM_DRAW,
                );
                return n;
            }

            // ════════════════════════════════════════════════════════════
            //  RENDER LOOP
            // ════════════════════════════════════════════════════════════
            function drawQuad(prog) {
                const loc = gl.getAttribLocation(prog, "a_pos");
                gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
                gl.enableVertexAttribArray(loc);
                gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            }

            function render() {
                if (!state.paused) state.t += 1;

                const n = buildCurve();

                // Pass 1 — feedback decay: fbA → fbB
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbB);
                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.useProgram(fbProg);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, texA);
                gl.uniform1i(gl.getUniformLocation(fbProg, "u_prev"), 0);
                gl.uniform1f(
                    gl.getUniformLocation(fbProg, "u_persist"),
                    state.persist,
                );
                drawQuad(fbProg);

                // Pass 2 — draw curve into fbB (additive blending)
                gl.useProgram(curveProg);
                gl.enable(gl.BLEND);
                gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

                gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
                gl.enableVertexAttribArray(
                    gl.getAttribLocation(curveProg, "a_pos"),
                );
                gl.vertexAttribPointer(
                    gl.getAttribLocation(curveProg, "a_pos"),
                    2,
                    gl.FLOAT,
                    false,
                    0,
                    0,
                );

                gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
                gl.enableVertexAttribArray(
                    gl.getAttribLocation(curveProg, "a_col"),
                );
                gl.vertexAttribPointer(
                    gl.getAttribLocation(curveProg, "a_col"),
                    4,
                    gl.FLOAT,
                    false,
                    0,
                    0,
                );

                gl.drawArrays(gl.LINE_STRIP, 0, n);
                gl.disable(gl.BLEND);

                // Swap ping-pong buffers
                [fbA, fbB] = [fbB, fbA];
                [texA, texB] = [texB, texA];

                // Pass 3 — bloom + invert → white background screen output
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(theme.paper01[0], theme.paper01[1], theme.paper01[2], 1);
                gl.clear(gl.COLOR_BUFFER_BIT);

                gl.useProgram(postProg);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, texA);
                gl.uniform1i(gl.getUniformLocation(postProg, "u_tex"), 0);
                gl.uniform1f(
                    gl.getUniformLocation(postProg, "u_bright"),
                    state.bright,
                );
                gl.uniform1f(
                    gl.getUniformLocation(postProg, "u_glow"),
                    state.glowR,
                );
                gl.uniform3fv(
                    gl.getUniformLocation(postProg, "u_bg"),
                    new Float32Array(theme.paper01),
                );
                drawQuad(postProg);

                // Update HUD
                const NAMES = ["LISS", "BROW", "LORZ", "STRG"];
                document.getElementById("disp-fx").textContent = state.fx;
                document.getElementById("disp-fy").textContent = state.fy;
                document.getElementById("disp-phase").textContent = (
                    state.phase / Math.PI
                ).toFixed(2);
                document.getElementById("disp-mode").textContent =
                    NAMES[state.curveMode];

                requestAnimationFrame(render);
            }

            // ════════════════════════════════════════════════════════════
            //  UI
            // ════════════════════════════════════════════════════════════
            const MODE_DESCS = [
                "Deterministic Lissajous figure",
                "Frequency modulated by smooth noise",
                "Lorenz strange attractor, xz-projection",
                "Irrational ratios φ·fₓ, e·f_y",
            ];

            document
                .getElementById("mode-bar")
                .addEventListener("click", (e) => {
                    const btn = e.target.closest(".mode-pill");
                    if (!btn) return;
                    const m = parseInt(btn.dataset.mode);
                    state.curveMode = m;
                    document
                        .querySelectorAll(".mode-pill")
                        .forEach((x) =>
                            x.classList.toggle("active", x === btn),
                        );
                    document.getElementById("mode-desc").textContent =
                        MODE_DESCS[m];
                    clearFB(fbA);
                    clearFB(fbB);
                    state.t = 0;
                });

            // document
            //     .getElementById("btn-save")
            //     .addEventListener("click", () => {
            //         const modeNames = [
            //             "lissajous",
            //             "brownian",
            //             "lorenz",
            //             "strange",
            //         ];
            //         const link = document.createElement("a");
            //         link.download = `harmonograph_${modeNames[state.curveMode]}_${Date.now()}.png`;
            //         link.href = canvas.toDataURL("image/png");
            //         link.click();
            //     });

            // ════════════════════════════════════════════════════════════
            //  GO
            // ════════════════════════════════════════════════════════════
            requestAnimationFrame(render);
        </script>
    </body>
</html>
